spring.application.name=distance-engine

# Database: docker compose sets DB_URL / DB_USER / DB_PASSWORD, these defaults are for a local Postgres.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/distance}
spring.datasource.username=${DB_USER:distance}
spring.datasource.password=${DB_PASSWORD:distance}

# Flyway owns the schema (db/migration). Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Background job that recomputes DEGRADED trips once the routing provider is back.
recompute.enabled=true
recompute.interval-ms=30000

# Login tokens (HS256). JWT_SECRET must be at least 32 characters. Override it outside development.
security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
security.jwt.ttl-seconds=3600
security.bcrypt-strength=10

# Demo accounts for trying the API: acme-admin, acme-operator, acme-employee, and the same for globex.
app.seed-demo-users=${SEED_DEMO_USERS:true}
app.demo-password=${DEMO_PASSWORD:demo-pass}

# One JSON object per log line. The request trace id is included automatically.
logging.structured.format.console=ecs
# Caffeine logs a warning with a stack trace whenever a routing call fails; we handle that failure
# ourselves (the trip is marked DEGRADED), so only real errors from it are interesting.
logging.level.com.github.benmanes.caffeine=ERROR

# Metrics: /actuator/prometheus and /actuator/metrics need an ADMIN token (see SecurityConfig).
management.endpoints.web.exposure.include=health,metrics,prometheus
