spring.application.name=distance-engine

# Database: docker compose sets DB_URL / DB_USER / DB_PASSWORD, these defaults are for a local Postgres.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/distance}
spring.datasource.username=${DB_USER:distance}
spring.datasource.password=${DB_PASSWORD:distance}

# Flyway owns the schema (db/migration). Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Background job that recomputes DEGRADED trips once the routing provider is back.
recompute.enabled=true
recompute.interval-ms=30000
