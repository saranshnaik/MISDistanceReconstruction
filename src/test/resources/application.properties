spring.application.name=distance-engine

# Tests run on in-memory H2 pretending to be PostgreSQL, same Flyway migrations as production.
spring.datasource.url=jdbc:h2:mem:distance;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# No background timers in tests; the job is called directly where it is tested.
recompute.enabled=false

security.jwt.secret=test-secret-test-secret-test-secret-0123456789
security.jwt.ttl-seconds=3600
security.bcrypt-strength=4
app.seed-demo-users=true
app.demo-password=demo-pass
